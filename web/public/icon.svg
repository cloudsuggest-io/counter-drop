<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Counter Drop logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#172235"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.52 0 0 0 0 0.90 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="9" y="9" width="494" height="494" rx="103" fill="none" stroke="#334155" stroke-width="2" opacity="0.72"/>

  <g transform="translate(0 -8)">
    <circle cx="256" cy="223" r="91" fill="#0284c7" opacity="0.20" filter="url(#blueGlow)"/>

    <path d="M 148 344 C 148 358 160 370 176 370 L 336 370 C 352 370 364 358 364 344 L 364 324 C 364 316 356 310 348 310 L 320 310 C 314 310 310 315 308 321 C 304 332 292 340 278 340 L 234 340 C 220 340 208 332 204 321 C 202 315 198 310 192 310 L 164 310 C 156 310 148 316 148 324 Z" fill="#1e293b" stroke="#475569" stroke-width="5" stroke-linejoin="round"/>
    <rect x="224" y="356" width="64" height="4" rx="2" fill="#38bdf8"/>

    <path d="M 256 112 C 245 130 205 190 185 237 C 174 263 174 292 190 316 C 204 338 228 352 256 352 C 284 352 308 338 322 316 C 338 292 338 263 327 237 C 307 190 267 130 256 112 Z" fill="url(#dropGrad)" filter="url(#softShadow)"/>

    <g transform="translate(256 266) scale(.9) translate(-256 -266)">
      <path d="M 226 214 C 226 210.7 228.7 208 232 208 L 266 208 L 286 228 L 286 288 C 286 291.3 283.3 294 280 294 L 232 294 C 228.7 294 226 291.3 226 288 Z" fill="url(#paperGrad)"/>
      <path d="M 266 208 L 266 228 L 286 228 Z" fill="#cbd5e1"/>
      <line x1="238" y1="234" x2="256" y2="234" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="238" y1="248" x2="274" y2="248" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="238" y1="262" x2="274" y2="262" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="238" y1="276" x2="262" y2="276" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="256" cy="178" r="8" fill="#ffffff" opacity=".95"/>
      <path d="M 256 142 L 256 162" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".82"/>
    </g>

    <path d="M 160 236 C 150 252 146 268 146 284" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity=".42"/>
    <path d="M 352 236 C 362 252 366 268 366 284" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity=".42"/>
  </g>

  <text x="256" y="442" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'SF Pro Display', 'Noto Sans', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="4">COUNTER DROP</text>
  <text x="256" y="468" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'SF Pro Display', 'Noto Sans', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="6">INSTANT PRINT WORKFLOW</text>
</svg>
